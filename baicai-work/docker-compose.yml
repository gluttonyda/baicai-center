services:
  worker-api:
    build: .
    container_name: baicai-worker-api
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "worker.py"]
    ports:
      - "8001:8001"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /data/links:/data/links
      - /cache/links:/cache/links
      - /data/rclone-cache:/data/rclone-cache
      - ./logs/rclone:/data/logs/rclone
      - ./runtime:/opt/baicai-worker/runtime
      # 镜像已内置 rclone 1.65.2（支持带 @ 的 remote 名）；这个挂载是可选的：
      # 只有想固定用宿主机特定版本时才需要，新节点可以直接删掉。
      - /usr/bin/rclone:/usr/bin/rclone:ro
      - /root/.config/rclone:/root/.config/rclone

  scanner:
    build: .
    container_name: baicai-worker-scanner
    restart: unless-stopped
    env_file:
      - .env
    command: ["/bin/bash", "/app/scanner-loop.sh"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /data/links:/data/links
      - /cache/links:/cache/links
      - /data/rclone-cache:/data/rclone-cache
      - ./logs/rclone:/data/logs/rclone
      - ./runtime:/opt/baicai-worker/runtime
